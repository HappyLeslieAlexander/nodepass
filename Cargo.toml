[workspace]
resolver = "2"
members = [
    "crates/nodepass-core",
    "crates/nodepass-transport",
    "crates/nodepass-tunnel",
    "crates/nodepass-master",
    "crates/nodepass-cli",
]

[workspace.package]
version = "1.1.1"
edition = "2021"
authors = ["NodePass Rust Team"]
license = "Apache-2.0"
repository = "https://github.com/NodePassProject/nodepass"

[workspace.dependencies]
nodepass-core = { path = "crates/nodepass-core" }
nodepass-transport = { path = "crates/nodepass-transport" }
nodepass-tunnel = { path = "crates/nodepass-tunnel" }
nodepass-master = { path = "crates/nodepass-master" }

tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1.6"
futures-util = "0.3"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
url = "2.5"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen = "0.13"
ring = "0.17"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
dashmap = "6.0"
parking_lot = "0.12"
socket2 = "0.6"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["connect", "handshake"] }
h2 = "0.4"
http = "1.1"
http-body-util = "0.1"
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
rand = "0.8"
tempfile = "3.10"
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
